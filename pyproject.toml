[project]
name = "ridepulse"
version = "0.1.0"
description = "ride-pulse — ride-sharing demand intelligence ML portfolio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandera>=0.20",
    "pyyaml>=6",
    "holidays>=0.57",
]

[project.scripts]
ridepulse = "ridepulse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    "pandas-stubs",
]
geo = [
    "geopandas",
    "shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ridepulse"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# ChecksumMismatch / LeakageError names are pinned by the implementation plan.
ignore = ["N818"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ridepulse"
markers = [
    "e2e: end-to-end smoke tests that exercise the full pipeline",
]
